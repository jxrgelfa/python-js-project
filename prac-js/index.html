<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Python/Javascript</title>
</head>
<body class="p-8 bg-gray-100 font-sans">
  <div class="flex w-full justify-around items-center gap-4 mb-6">
    <h1 class="text-2xl font-bold mb-6">LIBRERÍA CUCÚ</h1>
    <button id="profileBtn" class="bg-yellow-300 text-gray-800 px-4 py-2 rounded-md hover:bg-yellow-500">
        Mis Favoritos
    </button>
  </div>
  
  <div class="flex gap-8 items-start">
    <div class="bg-white p-6 rounded shadow max-w-sm w-full">

      <h2 class="font-bold mb-4 text-blue-600">Crear Artículo (POST)</h2>
      <form id="form-crear" class="flex flex-col gap-3">
        <input type="number" id="id" placeholder="ID" required class="border p-2 rounded">
        <input type="text" id="nombre" placeholder="Nombre" required class="border p-2 rounded">
        <input type="number" id="precio" placeholder="Precio" required class="border p-2 rounded">

        <label class="flex items-center gap-2">
          <input type="checkbox" id="activo" checked> Activo
        </label>

        <button type="submit" class="bg-blue-500 text-white py-2 rounded mt-2 hover:bg-blue-600" >
          Enviar a la API
        </button>
      </form>

    </div>

    <div class="w-full">
      <button onclick="obtenerLibros()" class="bg-green-500 text-white px-4 py-2 rounded mb-4 hover:bg-green-600">
        Obtener Artículos (GET)
      </button>

      <p class="text-sm font-bold mb-1">Respuesta del Servidor:</p>
      <div id="pantalla"
        class="bg-gray-900 text-green-500 p-4 rounded h-64 overflow-auto font-mono text-sm whitespace-pre-wrap">
        Esperando datos...
      </div>
    </div>
  </div>

  <div class="mt-8 bg-white p-6 rounded shadow max-w-sm">
    <h2 class="font-bold mb-4 text-yellow-600">Buscar, Editar o Borrar</h2>

    <div class="flex gap-2 mb-4">
      <input type="number" id="buscar-id" placeholder="ID artículo" class="border p-2 rounded w-full">
      <button onclick="buscarPorId()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
        Buscar
      </button>
      <button onclick="borrarDesdeBusqueda()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
        Borrar
      </button>
    </div>

    <form id="form-editar" class="flex flex-col gap-3">
      <div>
        <label class="text-xs text-gray-500 block">ID del artículo</label>
        <input type="number" id="edit-id" readonly
          class="border p-2 rounded bg-gray-100 w-full text-gray-500 cursor-not-allowed">
      </div>
      <input type="text" id="edit-nombre" placeholder="Nombre" required class="border p-2 rounded">
      <input type="number" step="0.01" id="edit-precio" placeholder="Precio" required class="border p-2 rounded">

      <label class="flex items-center gap-2">
        <input type="checkbox" id="edit-activo"> Activo
      </label>

      <button type="submit" class="bg-yellow-600 text-white py-2 rounded mt-2 hover:bg-yellow-700">
        Guardar Cambios (PUT)
      </button>
    </form>
  </div>
  <div id="librosContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4 w-full max-w-6xl">
    contenedor de cards
  </div>
  <script src="main.js"></script>
</body>
</html>
